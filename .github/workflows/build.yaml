name: Build

on:
  push:
  pull_request:

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        toolchain: [stable, beta]
      fail-fast: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Rust (${{ matrix.toolchain }})
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy, rust-src

      # Clippy is a superset of `cargo check`; only lint on stable since beta lints are still in flux.
      - name: Clippy lint
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo check
        if: matrix.toolchain != 'stable'
        run: cargo check --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace --all-targets --no-fail-fast

      - name: Check formatting
        run: cargo fmt --all -- --check

  features:
    name: Feature Check (${{ matrix.features || 'none' }})
    runs-on: ubuntu-latest

    # `cargo test` unifies features with dev-dependencies (which enable defaults), so non-default
    # feature sets must be checked with a plain `cargo check` on the library target.
    strategy:
      matrix:
        features:
          - ""
          - append
          - truncate
          - delete
          - derive
          - append,truncate
          - append,delete
          - truncate,delete
          - append,chrono,derive,json,uuid
          - chrono,derive,indexmap,json,url,utf8,uuid,yaml
          - append,truncate,utf16
      fail-fast: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Override the default `-D warnings`: feature-gated code paths leave unused items behind.
          rustflags: ""

      - name: Cargo check
        run: cargo check -p muon --no-default-features --features "${{ matrix.features }}"
